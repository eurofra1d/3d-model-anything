name: Build iOS capture app (unsigned)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-ios-unsigned.yml'
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode and install XcodeGen
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer
          xcodebuild -version
          xcodebuild -downloadPlatform iOS
          brew install xcodegen
      - name: Generate project
        working-directory: apps/house-capture
        run: xcodegen generate
      - name: Build unsigned Release device app
        working-directory: apps/house-capture
        run: |
          xcodebuild -project HouseCapture.xcodeproj -scheme HouseCapture -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        working-directory: apps/house-capture
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/HouseCapture.app Payload/
          zip -qry HouseCapture-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: HouseCapture-unsigned-iOS
          path: apps/house-capture/HouseCapture-unsigned.ipa
          retention-days: 7
